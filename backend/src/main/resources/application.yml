server:
  port: 8080

spring:
  application:
    name: pkampus-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pkampus_db}
    username: ${SPRING_DATASOURCE_USERNAME:pkampus_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pkampus_dev_password_change_in_prod_123!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:pkampus_app}
  secret-key: ${MINIO_SECRET_KEY:pkampus_minio_app_secret_dev_123!}
  bucket-issues: ${MINIO_BUCKET_ISSUES:pkampus-issues}
  bucket-avatars: ${MINIO_BUCKET_AVATARS:pkampus-avatars}

jwt:
  secret: ${JWT_SECRET:pkampus_jwt_super_secret_key_development_min_32_characters_long_2026!}
  expiration-minutes: 15
  refresh-expiration-days: 7

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  security:
    email-token-secret: ${EMAIL_TOKEN_SECRET:pkampus_email_activation_secret_key_dev_min_32_chars_2026!}
    email-token-ttl-hours: 24
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    max-active-refresh-tokens: ${MAX_ACTIVE_REFRESH_TOKENS:5}
    rate-limit:
      login:
        capacity: ${LOGIN_RATE_LIMIT_CAPACITY:5}
        duration-minutes: ${LOGIN_RATE_LIMIT_DURATION_MINUTES:1}
      register:
        capacity: ${REGISTER_RATE_LIMIT_CAPACITY:3}
        duration-minutes: ${REGISTER_RATE_LIMIT_DURATION_MINUTES:10}
      refresh:
        capacity: ${REFRESH_RATE_LIMIT_CAPACITY:30}
        duration-minutes: ${REFRESH_RATE_LIMIT_DURATION_MINUTES:1}
  scheduling:
    auto-cancellation:
      enabled: ${BOOKING_AUTO_CANCELLATION_ENABLED:true}
      cron: ${BOOKING_AUTO_CANCELLATION_CRON:0 * * * * *}
      late-threshold-minutes: ${BOOKING_LATE_THRESHOLD_MINUTES:15}
    retention:
      enabled: ${DATA_RETENTION_ENABLED:true}
      cron: ${DATA_RETENTION_CRON:0 30 3 * * *}
      issue-photos-days: ${DATA_RETENTION_ISSUE_PHOTOS_DAYS:30}
      posts-resolved-days: ${DATA_RETENTION_POSTS_RESOLVED_DAYS:30}
      posts-deleted-days: ${DATA_RETENTION_POSTS_DELETED_DAYS:14}
      comments-deleted-days: ${DATA_RETENTION_COMMENTS_DELETED_DAYS:14}
      bookings-purge-days: ${DATA_RETENTION_BOOKINGS_PURGE_DAYS:90}
      checked-out-anonymize-days: ${DATA_RETENTION_CHECKED_OUT_DAYS:365}

