# ==============================================================================
# PKampus CI (free tier: GitHub Actions + Vercel + Oracle A1 + Supabase)
# ==============================================================================
# Runs on every push and PR: fast backend unit tests + frontend lint/build.
# Mirrors the local gate from AGENTS.md (`make agent-check`).
# Full integrationTest suite is intentionally NOT here (slow, H2 slice tests
# run on demand per AGENTS.md: ./gradlew integrationTest --tests "...").
# ==============================================================================

name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon

  frontend:
    name: frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
