# ==============================================================================
# PKampus - Development Infrastructure (Docker Compose)
# ==============================================================================
# Starts local backing services: PostgreSQL, MinIO S3, and Mailpit SMTP.
# The backend and frontend run directly on the host machine (IntelliJ / Vite).
# ==============================================================================

networks:
  pkampus-net:
    driver: bridge

volumes:
  pg_data:
    driver: local
  minio_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Relational Database (PostgreSQL 16 Alpine)
  # ----------------------------------------------------------------------------
  pkampus-db:
    image: postgres:16-alpine
    container_name: pkampus-db
    restart: unless-stopped
    ports:
      - "${DB_PORT_BINDING:-127.0.0.1:5432:5432}"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pkampus_db}
      - POSTGRES_USER=${DB_USER:?DB_USER required}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro,z
    networks:
      - pkampus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $${POSTGRES_DB:-pkampus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Object Storage (MinIO S3)
  # ----------------------------------------------------------------------------
  pkampus-minio:
    image: quay.io/minio/minio:latest
    container_name: pkampus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT_BINDING:-127.0.0.1:9000:9000}"
      - "${MINIO_CONSOLE_BINDING:-127.0.0.1:9001:9001}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    volumes:
      - minio_data:/data
    networks:
      - pkampus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Initialization job to create buckets and app user
  pkampus-minio-init:
    image: quay.io/minio/mc:latest
    container_name: pkampus-minio-init
    depends_on:
      pkampus-minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      - MINIO_APP_USER=${MINIO_APP_USER:-pkampus_app}
      - MINIO_APP_PASSWORD=${MINIO_APP_PASSWORD:?MINIO_APP_PASSWORD required}
      - MINIO_BUCKET_ISSUES=${MINIO_BUCKET_ISSUES:-pkampus-issues}
      - MINIO_BUCKET_AVATARS=${MINIO_BUCKET_AVATARS:-pkampus-avatars}
    networks:
      - pkampus-net
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://pkampus-minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb --ignore-existing myminio/$$MINIO_BUCKET_ISSUES;
      /usr/bin/mc mb --ignore-existing myminio/$$MINIO_BUCKET_AVATARS;
      /usr/bin/mc admin user add myminio $$MINIO_APP_USER $$MINIO_APP_PASSWORD || true;
      /usr/bin/mc admin policy attach myminio readwrite --user $$MINIO_APP_USER;
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # 3. Mail Service (Mailpit SMTP + Web UI)
  # ----------------------------------------------------------------------------
  pkampus-mailpit:
    image: axllent/mailpit
    container_name: pkampus-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_WEB_BINDING:-127.0.0.1:8025:8025}"
      - "${MAIL_PORT_BINDING:-127.0.0.1:1025:1025}"
    networks:
      - pkampus-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
